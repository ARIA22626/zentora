
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zentora 3D Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101522;color:white;font-family:Tahoma,Arial}
header{height:65px;background:#192235;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #35435c}
header h2{font-size:17px;color:#71d9ff}
button{border:0;border-radius:9px;padding:11px 15px;background:#263953;color:white;cursor:pointer;font-family:inherit}
button:hover{filter:brightness(1.3)}
.primary{background:#087cdb}
.green{background:#128653}
.red{background:#b83c4b}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 65px)}
.sidebar{background:#192235;padding:15px;overflow:auto}
.sidebar h3{font-size:14px;color:#80d8ff;margin:12px 0}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{padding:12px 5px;text-align:center;border:1px solid #364862;background:#222f45}
.tool.active{border:2px solid #39baff;background:#24456b}
.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.color{height:35px;border:2px solid #64748b;border-radius:8px;cursor:pointer}
.color.active{outline:2px solid white}
.workspace{position:relative;min-width:0;min-height:600px}
#scene{position:absolute;inset:0}
#scene canvas{display:block;width:100%;height:100%}
.toolbar{position:absolute;top:12px;right:12px;left:12px;display:flex;gap:7px;flex-wrap:wrap;z-index:2;pointer-events:none}
.toolbar button{pointer-events:auto}
.hint{position:absolute;bottom:15px;right:15px;background:#111cddaa;padding:10px;border-radius:8px;font-size:12px;pointer-events:none}
.info{font-size:12px;color:#a9bbd0;line-height:2}
input{width:100%;padding:10px;border-radius:8px;background:#101b2d;color:white;border:1px solid #40516c}
#status{font-size:12px;color:#78e4ae;margin-top:12px;line-height:1.8}
@media(max-width:650px){
.layout{grid-template-columns:1fr}
.sidebar{order:2}
.workspace{height:65vh;min-height:430px;order:1}
}
</style>
</head>
<body>

<header>
<h2>🧊 ZENTORA 3D STUDIO</h2>
<button onclick="location.href='index.html'">🏠 بازگشت به سایت</button>
</header>

<div class="layout">
<aside class="sidebar">

<h3>🎮 ابزارهای طراحی</h3>
<div class="tools">
<button class="tool active" data-tool="add">🧱 بلوک</button>
<button class="tool" data-tool="erase">🗑 حذف</button>
<button class="tool" data-tool="player">🧍 بازیکن</button>
<button class="tool" data-tool="tree">🌳 درخت</button>
<button class="tool" data-tool="coin">🪙 سکه</button>
<button class="tool" data-tool="house">🏠 خانه</button>
</div>

<h3>🎨 انتخاب رنگ</h3>
<div class="colors" id="colors"></div>

<h3>📐 اندازه بلوک</h3>
<input id="blockSize" type="range" min="0.5" max="3" step="0.5" value="1">

<h3>🌍 نام بازی</h3>
<input id="gameName" maxlength="40" value="بازی جدید من">

<h3>💾 مدیریت پروژه</h3>
<div class="tools">
<button onclick="saveProject()">ذخیره</button>
<button onclick="loadProject()">بارگذاری</button>
<button onclick="clearWorld()">پاک کردن</button>
</div>

<h3>📖 راهنما</h3>
<div class="info">
• روی زمین کلیک کن تا بلوک بسازی.<br>
• ابزارها را عوض کن.<br>
• با موس دوربین را بچرخان.<br>
• چرخ موس برای زوم است.<br>
• کلیک راست برای حذف بلوک.
</div>

<div id="status">آماده طراحی هستی! 🚀</div>

</aside>

<main class="workspace">
<div id="scene"></div>

<div class="toolbar">
<button class="green" onclick="playGame()">▶ اجرای بازی</button>
<button class="primary" onclick="publishGame()">🌍 انتشار بازی</button>
<button onclick="exportProject()">📦 خروجی پروژه</button>
<button onclick="stopGame()">✏️ ویرایش</button>
</div>

<div class="hint" id="hint">
حالت طراحی | کلیک برای ساخت بلوک
</div>
</main>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

import {OrbitControls} from
'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

const container=document.getElementById('scene');

const scene=new THREE.Scene();
scene.background=new THREE.Color('#91b9d8');

scene.fog=new THREE.Fog('#91b9d8',35,90);

const camera=new THREE.PerspectiveCamera(
65,container.clientWidth/container.clientHeight,0.1,500
);

camera.position.set(12,12,16);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.target.set(0,1,0);

scene.add(new THREE.HemisphereLight(0xffffff,0x667788,2));

const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(12,20,10);
sun.castShadow=true;
scene.add(sun);

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(100,100),
new THREE.MeshStandardMaterial({color:'#70a85a'})
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
ground.name='ground';
scene.add(ground);

const grid=new THREE.GridHelper(50,50,'#ffffff','#8294a1');
grid.position.y=0.015;
scene.add(grid);

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

let objects=[];
let selectedColor='#45aaf2';
let selectedTool='add';
let blockSize=1;
let playing=false;
let player=null;
let keys={};
let jumpSpeed=0;
let playerHeight=1;
let selectedMeshes=[];

const palette=[
'#45aaf2','#e74c3c','#2ecc71','#f1c40f',
'#9b59b6','#ffffff','#34495e','#8e5a36',
'#ff8c42','#00cec9','#f78fb3','#777777'
];

const colorBox=document.getElementById('colors');

palette.forEach(color=>{
const el=document.createElement('button');
el.className='color';
el.style.background=color;
el.onclick=()=>{
selectedColor=color;
document.querySelectorAll('.color').forEach(x=>x.classList.remove('active'));
el.classList.add('active');
};
colorBox.appendChild(el);
});

colorBox.firstChild.classList.add('active');

document.querySelectorAll('[data-tool]').forEach(btn=>{
btn.onclick=()=>{
if(playing)return;
selectedTool=btn.dataset.tool;
document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('active'));
btn.classList.add('active');
};
});

document.getElementById('blockSize').oninput=e=>{
blockSize=Number(e.target.value);
};

function message(text){
document.getElementById('status').textContent=text;
}

function addObject(type,x,y,z,color,size=1){
let group=new THREE.Group();
group.position.set(x,y,z);

const mat=new THREE.MeshStandardMaterial({
color:color,
roughness:0.85
});

function mesh(geometry,px,py,pz){
const m=new THREE.Mesh(geometry,mat);
m.position.set(px,py,pz);
m.castShadow=true;
m.receiveShadow=true;
group.add(m);
}

if(type==='add'){
mesh(new THREE.BoxGeometry(size,size,size),0,size/2,0);
}
else if(type==='tree'){
mesh(new THREE.CylinderGeometry(.2,.25,1.5,8),0,.75,0);
const leaves=new THREE.Mesh(
new THREE.ConeGeometry(.85,2,8),
new THREE.MeshStandardMaterial({color:'#188d46'})
);
leaves.position.y=2.3;
leaves.castShadow=true;
group.add(leaves);
}
else if(type==='coin'){
mesh(new THREE.CylinderGeometry(.4,.4,.12,24),0,1,0);
group.rotation.x=Math.PI/2;
}
else if(type==='house'){
mesh(new THREE.BoxGeometry(2,1.6,2),0,.8,0);
const roof=new THREE.Mesh(
new THREE.ConeGeometry(1.65,1.2,4),
new THREE.MeshStandardMaterial({color:'#b34d38'})
);
roof.position.y=2.2;
roof.rotation.y=Math.PI/4;
roof.castShadow=true;
group.add(roof);
}
else if(type==='player'){
const body=new THREE.Mesh(
new THREE.BoxGeometry(.7,1.2,.4),
new THREE.MeshStandardMaterial({color:color})
);
body.position.y=1;
group.add(body);

const head=new THREE.Mesh(
new THREE.BoxGeometry(.55,.55,.55),
new THREE.MeshStandardMaterial({color:'#f0c49b'})
);
head.position.y=1.9;
group.add(head);
}

group.userData={
type,x,y,z,color,size
};

scene.add(group);
objects.push(group);
return group;
}

function removeObject(obj){
scene.remove(obj);
objects=objects.filter(o=>o!==obj);
}

function pick(event){
const rect=renderer.domElement.getBoundingClientRect();

pointer.x=((event.clientX-rect.left)/rect.width)*2-1;
pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;

raycaster.setFromCamera(pointer,camera);

return raycaster.intersectObjects(objects,true);
}

renderer.domElement.addEventListener('contextmenu',e=>{
e.preventDefault();
});

renderer.domElement.addEventListener('pointerdown',e=>{
if(playing)return;
if(e.button!==0)return;

const hits=pick(e);

if(selectedTool==='erase'){
if(hits.length){
let obj=hits[0].object;
while(obj.parent && obj.parent!==scene)obj=obj.parent;
if(objects.includes(obj)){
removeObject(obj);
message('شیء حذف شد.');
}
}
return;
}

if(hits.length && hits[0].object.parent!==scene){
let obj=hits[0].object;
while(obj.parent && obj.parent!==scene)obj=obj.parent;
if(objects.includes(obj))return;
}

const planeHit=raycaster.intersectObject(ground);

if(!planeHit.length)return;

const p=planeHit[0].point;
const x=Math.round(p.x);
const z=Math.round(p.z);

if(selectedTool==='player' &&
objects.some(o=>o.userData.type==='player')){
message('فقط یک بازیکن اصلی بساز.');
return;
}

addObject(
selectedTool,
x,
0,
z,
selectedColor,
blockSize
);

message('شیء جدید ساخته شد! ✨');
});

renderer.domElement.addEventListener('pointerdown',e=>{
if(playing && e.button===2)e.preventDefault();
});

renderer.domElement.addEventListener('pointermove',()=>{});

function resize(){
const w=container.clientWidth;
const h=container.clientHeight;
camera.aspect=w/h;
camera.updateProjectionMatrix();
renderer.setSize(w,h);
}

window.addEventListener('resize',resize);
resize();

function animate(){
requestAnimationFrame(animate);

if(playing && player){
const speed=.12;
if(keys['w']||keys['ArrowUp'])player.position.z-=speed;
if(keys['s']||keys['ArrowDown'])player.position.z+=speed;
if(keys['a']||keys['ArrowLeft'])player.position.x-=speed;
if(keys['d']||keys['ArrowRight'])player.position.x+=speed;

if(keys[' '] && player.position.y<=0.01){
jumpSpeed=.22;
}
player.position.y+=jumpSpeed;
jumpSpeed-=.009;

if(player.position.y<0){
player.position.y=0;
jumpSpeed=0;
}

camera.position.x+=(player.position.x+8-camera.position.x)*.035;
camera.position.y+=(player.position.y+7-camera.position.y)*.035;
camera.position.z+=(player.position.z+10-camera.position.z)*.035;
camera.lookAt(player.position);
}
controls.update();
renderer.render(scene,camera);
}
animate();

window.addEventListener('keydown',e=>{
keys[e.key.toLowerCase()]=true;
if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
});

window.addEventListener('keyup',e=>{
keys[e.key.toLowerCase()]=false;
});

window.saveProject=function(){
const data={
name:document.getElementById('gameName').value,
objects:objects.map(o=>o.userData)
};

localStorage.setItem('zentora_studio_project',JSON.stringify(data));
message('پروژه ذخیره شد. 💾');
};

window.loadProject=function(){
const raw=localStorage.getItem('zentora_studio_project');
if(!raw){message('پروژه ذخیره‌شده‌ای پیدا نشد.');return;}

try{
const data=JSON.parse(raw);
clearWorld();
document.getElementById('gameName').value=data.name||'بازی من';

data.objects.forEach(o=>{
addObject(o.type,o.x,o.y,o.z,o.color,o.size);
});
message('پروژه بارگذاری شد.');
}catch(e){message('خطا در بارگذاری پروژه.');}
};

window.clearWorld=function(){
if(!confirm('تمام اشیای دنیا پاک شوند؟'))return;
objects.forEach(o=>scene.remove(o));
objects=[];
stopGame();
message('دنیای بازی پاک شد.');
};

window.exportProject=function(){
const data={
name:document.getElementById('gameName').value,
objects:objects.map(o=>o.userData)
};

download(
JSON.stringify(data,null,2),
'zentora-project.json',
'application/json'
);
message('فایل پروژه آماده شد.');
};

window.playGame=function(){
if(playing)return;
playing=true;
controls.enabled=false;
grid.visible=false;

let p=objects.find(o=>o.userData.type==='player');

if(!p){
player=addObject('player',0,0,0,'#3498db');
}else{
player=p;
}

player.position.y=0;
camera.position.set(
player.position.x+8,
player.position.y+7,
player.position.z+10
);

document.getElementById('hint').textContent=
'حالت بازی | حرکت: WASD یا کلیدهای جهت | پرش: Space';

message('بازی اجرا شد! 🎮');
};

window.stopGame=function(){
playing=false;
controls.enabled=true;
grid.visible=true;
player=null;

camera.position.set(12,12,16);
controls.target.set(0,1,0);

document.getElementById('hint').textContent=
'حالت طراحی | کلیک برای ساخت بلوک';

message('به حالت طراحی برگشتی.');
};

function download(content,name,type){
const blob=new Blob([content],{type:type});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;
a.download=name;
a.click();
URL.revokeObjectURL(url);
}

window.publishGame=function(){
if(objects.length===0){
message('اول دنیای بازی را طراحی کن!');
return;
}

const data={
name:document.getElementById('gameName').value||'Zentora Game',
objects:objects.map(o=>o.userData)
};

const safe=JSON.stringify(data).replace(/</g,'\\u003c');

const html=`<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${data.name}</title>
<style>
body{margin:0;overflow:hidden;font-family:Tahoma}
#title{position:absolute;top:12px;left:12px;background:#17243c;color:white;padding:12px;border-radius:9px;z-index:2}
#help{position:absolute;bottom:12px;left:12px;background:#17243c;color:white;padding:10px;border-radius:8px;z-index:2}
</style>
</head>
<body>
<div id="title">${data.name}</div>
<div id="help">حرکت: WASD | پرش: Space</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const data=${safe};
const scene=new THREE.Scene();
scene.background=new THREE.Color('#91b9d8');
scene.add(new THREE.HemisphereLight(0xffffff,0x667788,2));
const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(12,20,10);scene.add(sun);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
camera.position.set(8,8,10);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:'#70a85a'}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
let player;
const objects=[];
data.objects.forEach(o=>{
const group=new THREE.Group();
group.position.set(o.x,o.y,o.z);
const mat=new THREE.MeshStandardMaterial({color:o.color});
function mesh(g,x,y,z){
const m=new THREE.Mesh(g,mat);m.position.set(x,y,z);group.add(m);
}
if(o.type==='add')mesh(new THREE.BoxGeometry(o.size,o.size,o.size),0,o.size/2,0);
if(o.type==='tree'){
mesh(new THREE.CylinderGeometry(.2,.25,1.5,8),0,.75,0);
const leaves=new THREE.Mesh(new THREE.ConeGeometry(.85,2,8),new THREE.MeshStandardMaterial({color:'#188d46'}));
leaves.position.y=2.3;group.add(leaves);
}
if(o.type==='coin')mesh(new THREE.CylinderGeometry(.4,.4,.12,24),0,1,0);
if(o.type==='house'){
mesh(new THREE.BoxGeometry(2,1.6,2),0,.8,0);
const roof=new THREE.Mesh(new THREE.ConeGeometry(1.65,1.2,4),new THREE.MeshStandardMaterial({color:'#b34d38'}));
roof.position.y=2.2;roof.rotation.y=Math.PI/4;group.add(roof);
}
if(o.type==='player'){
mesh(new THREE.BoxGeometry(.7,1.2,.4),0,1,0);
mesh(new THREE.BoxGeometry(.55,.55,.55),0,1.9,0);
player=group;
}
scene.add(group);objects.push(group);
});
if(!player){
player=new THREE.Group();
scene.add(player);
}
const keys={};let jump=0;
onkeydown=e=>keys[e.key.toLowerCase()]=true;
onkeyup=e=>keys[e.key.toLowerCase()]=false;
function loop(){
requestAnimationFrame(loop);
const s=.12;
if(keys.w||keys.arrowup)player.position.z-=s;
if(keys.s||keys.arrowdown)player.position.z+=s;
if(keys.a||keys.arrowleft)player.position.x-=s;
if(keys.d||keys.arrowright)player.position.x+=s;
if(keys[' ']&&player.position.y<=0)jump=.22;
player.position.y+=jump;jump-=.009;
if(player.position.y<0){player.position.y=0;jump=0;}
camera.position.set(player.position.x+8,player.position.y+7,player.position.z+10);
camera.lookAt(player.position);
renderer.render(scene,camera);
}
loop();
onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);};
</scr`+'ipt>'+
'</body></html>';

download(html,'zentora-game.html','text/html');
message('نسخه قابل اجرای بازی ساخته شد! فایل HTML دانلود شد. 🚀');
};
</script>
</body>
</html>
