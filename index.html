
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENTORA | دنیای بازی‌ها</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:Tahoma,Arial,sans-serif}
header{padding:25px 15px;text-align:center;background:linear-gradient(135deg,#151d42,#5126a5)}
header h1{font-size:34px;color:#a9a5ff;margin:5px}
header p{color:#ddd}
main{max-width:1100px;margin:auto;padding:18px}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:15px}
.stat{background:#1b2440;padding:12px 20px;border-radius:14px}
input{width:100%;padding:15px;border:1px solid #39456c;border-radius:12px;background:#151d32;color:white;font-size:16px;margin:12px 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button{border:0;border-radius:10px;padding:11px 15px;background:#7049e9;color:white;cursor:pointer;font-size:14px}
button:hover{filter:brightness(1.2)}
button.active{background:#16a68a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.card{background:#18223c;border:1px solid #303e63;padding:17px 12px;border-radius:15px;text-align:center;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#9c82ff}
.card .emoji{font-size:35px}
.card h3{font-size:14px;min-height:34px}
.card small{color:#a9b6d8}
#game{display:none;background:#151e36;border:1px solid #46517b;border-radius:18px;padding:20px;margin-top:20px;text-align:center}
#game h2{color:#b9a7ff}
.game-number{font-size:30px;margin:15px}
.result{background:#222e4c;padding:15px;border-radius:12px;margin:15px 0;min-height:55px}
.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.actions button{min-width:105px}
.bar{height:12px;background:#35415c;border-radius:20px;overflow:hidden;margin:12px 0}
.bar div{height:100%;background:#32d6a0;width:0;transition:.3s}
footer{text-align:center;color:#8e9bb9;padding:25px}
.hidden{display:none}
</style>
</head>
<body>

<header>
<h1>🐉 ZENTORA</h1>
<p>دنیای ۱۴۲ بازی متنوع و سرگرم‌کننده</p>
<div class="stats">
<div class="stat">🎮 تعداد بازی‌ها: <b>۱۴۲</b></div>
<div class="stat">⚽ ورزشی: <b>۱۰۰</b></div>
<div class="stat">💰 اقتصادی: <b>۴۲</b></div>
</div>
</header>

<main>
<h2>🌍 انتخاب دنیای بازی</h2>
<input id="search" placeholder="🔎 اسم بازی را جستجو کن..." oninput="render()">

<div class="filters">
<button class="active" onclick="setFilter('all',this)">همه بازی‌ها</button>
<button onclick="setFilter('sport',this)">⚽ ورزشی</button>
<button onclick="setFilter('business',this)">💰 اقتصادی</button>
</div>

<div id="count"></div>
<div class="grid" id="games"></div>

<section id="game">
<h2 id="gameTitle"></h2>
<p id="gameDescription"></p>
<div class="game-number" id="gameEmoji"></div>
<div class="result" id="result">برای شروع بازی روی دکمه شروع بزن!</div>
<div id="gameStats"></div>
<div id="gameActions" class="actions"></div>
<br>
<button onclick="closeGame()">⬅️ بازگشت به بازی‌ها</button>
</section>
</main>

<footer>
🐉 ZENTORA | دنیای سرگرمی و بازی
<br>تمام پول‌ها در این سایت مجازی هستند.
</footer>

<script>
const sports = [
["فوتبال","⚽"],["بسکتبال","🏀"],["والیبال","🏐"],["تنیس","🎾"],
["تنیس روی میز","🏓"],["بدمینتون","🏸"],["هندبال","🤾"],["فوتسال","⚽"],
["راگبی","🏉"],["کریکت","🏏"],["بیسبال","⚾"],["گلف","⛳"],
["بولینگ","🎳"],["بیلیارد","🎱"],["شطرنج ورزشی","♟️"],["دوچرخه‌سواری","🚴"],
["دوچرخه‌سواری کوهستان","🚵"],["مسابقه دو","🏃"],["ماراتن","🏃"],["پرش طول","🦘"],
["پرش ارتفاع","🏅"],["پرتاب دیسک","🥏"],["پرتاب وزنه","🏋️"],["ژیمناستیک","🤸"],
["شنا","🏊"],["شیرجه","🤿"],["قایقرانی","🚣"],["کایاک","🛶"],
["اسکی","⛷️"],["اسنوبرد","🏂"],["اسکیت","🛼"],["اسکیت‌بورد","🛹"],
["هاکی روی یخ","🏒"],["هاکی روی چمن","🏑"],["بوکس","🥊"],["شمشیربازی","🤺"],
["تیراندازی با کمان","🏹"],["وزنه‌برداری","🏋️"],["کشتی","🤼"],["جودو","🥋"],
["تکواندو","🥋"],["کاراته","🥋"],["پینگ‌پنگ دوبل","🏓"],["فوتبال ساحلی","🏖️"],
["فوتبال آمریکایی","🏈"],["فوتبال دستی","⚽"],["واترپلو","🤽"],["اسکواش","🎾"],
["راکت‌بال","🎾"],["پدل","🎾"],["والیبال ساحلی","🏐"],["طناب‌زنی","🪢"],
["پارکور","🏃"],["کوهنوردی ورزشی","🧗"],["سنگ‌نوردی","🧗"],["اسب‌سواری","🐎"],
["مسابقه اسب‌دوانی","🏇"],["اتومبیل‌رانی","🏎️"],["کارتینگ","🏎️"],["موتورسواری","🏍️"],
["مسابقه قایق","🚤"],["مسابقه پهپاد","🛸"],["بولینگ چمنی","🎳"],["دارت","🎯"],
["پرتاب نیزه","🏅"],["دو با مانع","🏃"],["دو امدادی","🏃"],["سه‌گانه","🏅"],
["پنج‌گانه","🏅"],["قایقرانی بادبانی","⛵"],["موج‌سواری","🏄"],["غواصی","🤿"],
["اسکی روی آب","🌊"],["بازی برف","❄️"],["کرلینگ","🥌"],["بیاتلون","🎿"],
["بازی شافل‌بورد","🎯"],["پتانک","🎯"],["کروکت","🏑"],["لاکراس","🥍"],
["کبدی","🤼"],["سپک تاکرا","🏐"],["سافت‌بال","🥎"],["پولو","🐎"],
["فریزبی","🥏"],["فوتبال حبابی","⚽"],["طناب‌کشی","🪢"],["دو با کیسه","🏃"],
["مسابقه موانع","🏅"],["قایقرانی تیمی","🚣"],["اسکیت سرعت","🛼"],["اسکیت نمایشی","⛸️"],
["رقص ورزشی","💃"],["ورزش سه‌گانه آبی","🏊"],["کبدی ساحلی","🏖️"],["بازی حلقه","⭕"],
["توپ‌دستی","🏐"],["مسابقه سرعت","🏁"],["مسابقه پرش","🏆"]
];

const businesses = [
["دلار اول","💵","فروشگاه کوچک"],["امپراتوری فروشگاه","🏪","فروشگاه"],
["شهرساز","🏙️","شهر"],["مدیر هتل","🏨","هتل"],
["کارخانه‌دار","🏭","کارخانه"],["مدیر رستوران","🍔","رستوران"],
["امپراتوری بازی","🎮","استودیوی بازی"],["مدیر کافه","☕","کافه"],
["مزرعه‌دار","🌾","مزرعه"],["مدیر سوپرمارکت","🛒","سوپرمارکت"],
["سازنده خانه","🏠","ساختمان"],["مدیر فرودگاه","✈️","فرودگاه"],
["مدیر بندر","🚢","بندر"],["مدیر سینما","🎬","سینما"],
["مدیر شهربازی","🎡","شهربازی"],["مدیر بیمارستان","🏥","بیمارستان"],
["مدیر مدرسه","🏫","مدرسه"],["مدیر موزه","🏛️","موزه"],
["شرکت فضایی","🚀","شرکت فضایی"],["شرکت ربات‌سازی","🤖","ربات"],
["مدیر معدن","⛏️","معدن"],["مدیر جواهرات","💎","جواهرفروشی"],
["مدیر کتاب‌فروشی","📚","کتاب‌فروشی"],["مدیر لباس","👕","فروشگاه لباس"],
["مدیر اسباب‌بازی","🧸","فروشگاه اسباب‌بازی"],["مدیر حیوانات","🐾","مرکز حیوانات"],
["مدیر باغ‌وحش","🦁","باغ‌وحش"],["مدیر پارک","🌳","پارک"],
["مدیر تاکسی","🚕","شرکت تاکسی"],["مدیر قطار","🚆","راه‌آهن"],
["شرکت هواپیمایی","🛫","هواپیمایی"],["مدیر کشتی","🛳️","کشتی"],
["مدیر انرژی","⚡","نیروگاه"],["مدیر فناوری","💻","شرکت فناوری"],
["مدیر اینترنت","🌐","شرکت اینترنت"],["مدیر تولید غذا","🍕","کارخانه غذا"],
["مدیر نوشیدنی","🥤","کارخانه نوشیدنی"],["مدیر مزرعه حیوانات","🐄","دامداری"],
["مدیر گل‌فروشی","🌷","گل‌فروشی"],["مدیر پیتزا","🍕","پیتزافروشی"],
["مدیر شهر بازی","🎠","مرکز تفریحی"],["امپراتوری تجارت","🌍","شرکت تجاری"]
];

let filter = "all";
let current = null;
let sportsRound = 0;
let sportsScore = 0;
let economy = null;

function allGames(){
 return [
 ...sports.map((x,i)=>({id:"s"+i,name:x[0],emoji:x[1],type:"sport",desc:"بازی ورزشی "+x[0]})),
 ...businesses.map((x,i)=>({id:"b"+i,name:x[0],emoji:x[1],type:"business",product:x[2],desc:"بازی اقتصادی و مدیریت "+x[2]}))
 ];
}

const games = allGames();

function setFilter(f,btn){
 filter=f;
 document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 render();
}

function render(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 const list=games.filter(g=>
 (filter==="all"||g.type===filter)&&g.name.toLowerCase().includes(q)
 );
 document.getElementById("count").textContent="نمایش "+list.length+" بازی";
 document.getElementById("games").innerHTML=list.map(g=>`
 <div class="card" onclick="openGame('${g.id}')">
 <div class="emoji">${g.emoji}</div>
 <h3>${g.name}</h3>
 <small>${g.type==="sport"?"⚽ ورزشی":"💰 اقتصادی"}</small>
 </div>`).join("");
}
function save(data){
 localStorage.setItem("zentora_"+current.id,JSON.stringify(data));
}
function load(g){
 try{return JSON.parse(localStorage.getItem("zentora_"+g.id));}
 catch(e){return null;}
}
function openGame(id){
 current=games.find(g=>g.id===id);
 document.getElementById("game").style.display="block";
 document.getElementById("gameTitle").textContent=current.name;
 document.getElementById("gameEmoji").textContent=current.emoji;
 document.getElementById("gameDescription").textContent=current.desc;
 document.getElementById("game").scrollIntoView({behavior:"smooth"});
 if(current.type==="sport") sportScreen();
 else economyScreen();
}
function closeGame(){
 document.getElementById("game").style.display="none";
 current=null;
 window.scrollTo({top:0,behavior:"smooth"});
}
function setResult(t){
 document.getElementById("result").textContent=t;
}
function setActions(html){
 document.getElementById("gameActions").innerHTML=html;
}
function setStats(html){
 document.getElementById("gameStats").innerHTML=html;
}

/* بازی ورزشی */
function sportScreen(){
 sportsRound=0;
 sportsScore=0;
 setStats("مسابقه ۱۰ مرحله‌ای");
 setResult("آماده‌ای؟ در هر مرحله یک حرکت انجام بده و امتیاز بگیر!");
 setActions('<button onclick="startSport()">🏆 شروع مسابقه</button>');
}
function startSport(){
 sportsRound=0;
 sportsScore=0;
 sportStep();
}
function sportStep(){
 if(sportsRound>=10){
 setResult("🏆 مسابقه تمام شد! امتیاز نهایی: "+sportsScore);
 setStats("امتیاز: "+sportsScore+" | مراحل: ۱۰ از ۱۰");
 setActions('<button onclick="startSport()">🔄 مسابقه دوباره</button>');
 return;
 }
 setStats("مرحله "+(sportsRound+1)+" از ۱۰ | امتیاز: "+sportsScore);
 setResult("حرکت "+current.name+" را انجام بده!");
 setActions(`
 <button onclick="sportMove(1)">حرکت ساده</button>
 <button onclick="sportMove(2)">حرکت حرفه‌ای</button>
 <button onclick="sportMove(3)">حرکت ویژه</button>`);
}
function sportMove(level){
 let success=Math.random();
 let points=success>.18?level*10:0;
 sportsScore+=points;
 sportsRound++;
 setResult(points?"آفرین! "+points+" امتیاز گرفتی! 🎉":"این مرحله امتیازی نداشت. دوباره تلاش کن!");
 sportStep();
}

/* بازی اقتصادی */
function economyScreen(){
 economy=load(current)||{
 money:20,
 level:1,
 stock:0,
 sales:0,
 upgrades:0
 };
 economyRender();
}
function economyRender(){
 const money=economy.money;
 const level=economy.level;
 setStats(`
 <div class="result">
 💵 موجودی: <b>${money.toFixed(2)} دلار مجازی</b><br>
 ⭐ سطح کسب‌وکار: ${level}<br>
 📦 محصولات: ${economy.stock}<br>
 🛒 فروش‌ها: ${economy.sales}
 </div>
 <div class="bar"><div style="width:${Math.min(100,level*10)}%"></div></div>
 `);
 setResult("به "+current.product+" خودت خوش آمدی! کسب‌وکارت را توسعه بده.");
 setActions(`
 <button onclick="work()">💼 کار کردن</button>
 <button onclick="buyStock()">📦 خرید کالا</button>
 <button onclick="sellStock()">🛒 فروش کالا</button>
 <button onclick="upgrade()">⬆️ ارتقا</button>
 <button onclick="businessBonus()">🎁 جایزه روزانه</button>
 `);
 save(economy);
}
function work(){
 economy.money+=5+economy.level;
 setResult("💵 از فعالیت کسب‌وکارت "+(5+economy.level)+" دلار درآمد گرفتی!");
 economyRender();
}
function buyStock(){
 let price=5+economy.level*2;
 if(economy.money<price){
 setResult("پول کافی نداری! ابتدا کار کن.");
 return;
 }
 economy.money-=price;
 economy.stock++;
 setResult("📦 یک محصول خریدی. هزینه: "+price+" دلار");
 economyRender();
}
function sellStock(){
 if(economy.stock<1){
 setResult("محصولی برای فروش نداری! اول کالا بخر.");
 return;
 }
 let income=10+economy.level*3;
 economy.stock--;
 economy.money+=income;
 economy.sales++;
 setResult("🎉 محصولت را به قیمت "+income+" دلار فروختی!");
 economyRender();
}
function upgrade(){
 let price=20+economy.level*15;
 if(economy.money<price){
 setResult("برای ارتقا به "+price+" دلار نیاز داری.");
 return;
 }
 economy.money-=price;
 economy.level++;
 economy.upgrades++;
 setResult("🚀 کسب‌وکارت ارتقا پیدا کرد! سطح جدید: "+economy.level);
 economyRender();
}
function businessBonus(){
 if(economy.bonusDate===new Date().toDateString()){
 setResult("جایزه امروز را قبلاً دریافت کرده‌ای!");
 return;
 }
 economy.money+=10;
 economy.bonusDate=new Date().toDateString();
 setResult("🎁 ۱۰ دلار مجازی جایزه گرفتی!");
 economyRender();
}

render();

if(games.length!==142){
 document.getElementById("count").textContent="خطا در تعداد بازی‌ها";
}
</script>
</body>
</html>
